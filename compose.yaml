name: ${COMPOSE_PROJECT_NAME:-nginx-waf}

services:
  waf:
    image: ${WAF_IMAGE:-nginx-waf}:${WAF_VERSION:-2.0.3}
    build:
      context: .
      args:
        NGINX_VERSION: "1.30.4"
        NGINX_COMMIT: "017cf98dcce217946572a896f0992370475e189f"
        MODSECURITY_COMMIT: "7ea9fefbe0ba409d8733b4d682c8c4c059cd028d"
        MODSECURITY_NGINX_COMMIT: "3f4b57df10ce43b1f1c722141f7621dc64838be8"
        CRS_COMMIT: "3b89d5a05322f448b4b74b9cadc5fb05ac6915ad"
        GEOIP2_COMMIT: "cbaa35461c62a99d2577e6bae3273492502d8769"
        WAF_UID: "${WAF_UID:-10001}"
        WAF_GID: "${WAF_GID:-10001}"
    container_name: nginx-waf
    hostname: nginx-waf
    restart: unless-stopped
    init: true

    ports:
      - "${WAF_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:8080/tcp"
      # Enable only after configuring a TLS virtual host:
      # - "${WAF_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:8443/tcp"

    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/snippets:/etc/nginx/snippets:ro
      - ./config/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./config/modsecurity:/etc/modsecurity:ro
      - ./config/html:/usr/share/nginx/html/custom:ro
      - ./data/geoip:/var/lib/geoip:ro
      - ./logs/modsecurity:/var/log/modsecurity
      # TLS is optional. Uncomment with the HTTPS port above.
      # - ./certs:/etc/nginx/certs:ro

    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    environment:
      TZ: ${TZ:-Europe/Paris}

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - frontend
      - backend

networks:
  frontend:
    name: waf-frontend
    driver: bridge
  backend:
    name: waf-backend
    driver: bridge
    # Set internal: true only when every backend reachable by this WAF
    # is attached to this Docker network and does not require routed LAN access.
    # internal: true
