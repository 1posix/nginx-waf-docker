# Zones only allocate shared memory here. Limits are applied per location
# through snippets/rate-limit-*.conf.
limit_req_zone $binary_remote_addr zone=general:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:20m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=strict:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

limit_req_status 429;
limit_req_log_level notice;
limit_conn_status 429;
