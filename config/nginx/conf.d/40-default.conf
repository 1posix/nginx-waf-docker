server {
    listen 8080 default_server;
    server_name _;

    # Runtime liveness only. Deliberately bypasses WAF and access logging.
    location = /health {
        modsecurity off;
        access_log off;
        default_type text/plain;
        return 200 "WAF OK\n";
    }

    # Local status endpoint for future monitoring integrations.
    location = /nginx_status {
        modsecurity off;
        access_log off;
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # Smoke-test endpoint: WAF remains enabled here and serves static content.
    location = /waf-test {
        access_log off;
        root /usr/share/nginx/html/custom;
        try_files /waf-test.txt =404;
    }

    location / {
        return 444;
    }
}
