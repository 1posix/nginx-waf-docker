# Blocking mode. For initial migration/tuning you may temporarily change this to
# DetectionOnly, review logs, then restore On.
SecRuleEngine On

SecRequestBodyAccess On

# Must remain aligned with nginx client_max_body_size (16 MiB by default).
SecRequestBodyLimit 16777216
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 256
SecArgumentsLimit 1000

# Inspect text-like responses only. Large/streaming media is not buffered here.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# Writable private paths live on the container tmpfs.
SecTmpDir /tmp/nginx

# Audit only relevant/security-significant transactions.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON

SecStatusEngine Off
