# Base engine configuration supplied by the exact ModSecurity build in the image.
Include /opt/modsecurity/modsecurity.conf

# Local deterministic overrides.
Include /etc/modsecurity/engine.conf

# CRS configuration must load before CRS rules.
Include /etc/modsecurity/crs-setup.conf

# Local exclusions/virtual patches before CRS.
Include /etc/modsecurity/custom/REQUEST-900-BEFORE-CRS.conf

# OWASP CRS is immutable and supplied by the image.
Include /opt/owasp-crs/rules/*.conf

# Local response exclusions/actions after CRS.
Include /etc/modsecurity/custom/RESPONSE-999-AFTER-CRS.conf
