# nginx-waf-docker V2 - OWASP CRS 4.25.1 LTS baseline
# Keep this file small: CRS defaults are intentionally retained unless overridden.

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

# Blocking Paranoia Level 1: stable baseline with the lowest FP rate.
SecAction     "id:900000,    phase:1,    pass,    t:none,    nolog,    tag:'OWASP_CRS',    ver:'OWASP_CRS/4.25.1',    setvar:tx.blocking_paranoia_level=1"

# Recommended default thresholds: one critical inbound match blocks.
SecAction     "id:900110,    phase:1,    pass,    t:none,    nolog,    tag:'OWASP_CRS',    ver:'OWASP_CRS/4.25.1',    setvar:tx.inbound_anomaly_score_threshold=5,    setvar:tx.outbound_anomaly_score_threshold=4"

# Less noisy than CRS 4's default reporting level 4 while still reporting blocks.
SecAction     "id:900115,    phase:1,    pass,    t:none,    nolog,    tag:'OWASP_CRS',    ver:'OWASP_CRS/4.25.1',    setvar:tx.reporting_level=1"

# Required by OWASP CRS 4.25.1.
# Confirms that the version-matched CRS setup was loaded before the rules.
SecAction \
"id:900990,\
phase:1,\
pass,\
t:none,\
nolog,\
tag:'OWASP_CRS',\
ver:'OWASP_CRS/4.25.1',\
setvar:tx.crs_setup_version=4251"
