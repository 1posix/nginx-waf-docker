# Generic Plex example. Review the address and your network policy before use.
# Copy to config/nginx/sites-enabled/30-plex.conf.
server {
    listen 8080;
    server_name plex.example.net;

    # Plex commonly uses long-lived connections.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/websocket.conf;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_pass http://192.168.10.40:32400;
    }
}
