# Requires GeoLite2-Country.mmdb in ./data/geoip.
geoip2 /var/lib/geoip/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $geoip2_country_code default=ZZ country iso_code;
}

# Example policy. Keep geographic policy local to your infrastructure.
map $geoip2_country_code $geo_blocked {
    default 0;
    # CN 1;
    # RU 1;
}
